{% extends "auth.html" %}
{% block title %}Log in{% endblock %}
{% block main %}
<p class="login-box-msg">Log in to send statements to Firefly</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form action="/login" method="post">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="input-group mb-3">
    <input class="form-control" name="username" value="{{ username or '' }}" placeholder="Username" aria-label="Username"
           autocomplete="username" required autofocus>
    <div class="input-group-text"><i class="bi bi-person"></i></div>
  </div>
  <div class="input-group mb-3">
    <input class="form-control" type="password" name="password" placeholder="Password" aria-label="Password"
           autocomplete="current-password" required>
    <div class="input-group-text"><i class="bi bi-lock"></i></div>
  </div>
  <div class="d-grid"><button class="btn btn-primary">Log in</button></div>
</form>
{% endblock %}
