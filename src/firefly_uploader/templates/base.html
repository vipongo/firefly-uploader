<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Firefly uploader{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="{{ '/c/' ~ connection.id if connection else '/' }}">Firefly uploader</a>
  {% if firefly %}
    {% if firefly.error %}
      <span class="connection bad">Firefly at {{ firefly.host }}: {{ firefly.error }}</span>
    {% else %}
      <span class="connection">Firefly {{ firefly.version }} at {{ firefly.host }} as <strong>{{ firefly.user }}</strong></span>
    {% endif %}
  {% endif %}
  {% if session %}
    <nav>
      <a href="/">Firefly connections</a>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf" value="{{ session.csrf }}">
        <button class="link" title="Logged in as {{ session.username }}">Log out {{ session.username }}</button>
      </form>
    </nav>
  {% endif %}
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
