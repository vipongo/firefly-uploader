# For Komodo (Stack with the compose file written in the UI) or `docker compose up -d`.
# Updating = pulling the newer image and recreating the container; the database upgrades itself.
services:
  firefly-uploader:
    image: ghcr.io/vipongo/firefly-uploader:latest
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - uploader-data:/data  # the database and secret.key: back up both together
    environment:
      # Behind a reverse proxy that serves it over https: the proxy's IP address (or "*" if the
      # port above isn't reachable from elsewhere), so the app knows pages are asked over https.
      FORWARDED_ALLOW_IPS: "127.0.0.1"

volumes:
  uploader-data:
