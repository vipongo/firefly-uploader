[project]
name = "firefly-uploader"
version = "0.1.0"
description = "Upload UBS and Revolut statements into Firefly III"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]  # httpx2: what starlette's TestClient wants

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firefly_uploader = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
